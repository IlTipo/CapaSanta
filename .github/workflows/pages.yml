# Pubblica il sito su GitHub Pages a ogni push su main.
# Il sito è statico: non c'è build, si carica la cartella così com'è.
# Va abilitato una volta sola in Settings → Pages → Source: GitHub Actions.
name: Deploy sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        # attiva Pages da solo al primo giro, così non serve toccare le
        # impostazioni del repository a mano
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
